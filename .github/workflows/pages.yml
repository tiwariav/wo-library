name: Pages

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Site layout: Storybook (the documentation) at the root, shadcn registry JSON under /r/.
      - name: Build API reference
        run: pnpm run docs
      - name: Build Storybook
        run: pnpm --filter @wo-library/storybook build-storybook -o ../../site
      - name: Build registry
        working-directory: packages/registry
        run: pnpm exec shadcn build -o ../../site/r
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

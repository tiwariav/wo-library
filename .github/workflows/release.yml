name: "Release"

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      specifier:
        description: "Version specifier (patch|minor|major|x.y.z). Empty = conventional commits."
        required: false
        default: ""
      projects:
        description: "Comma-separated project names to release. Empty = all."
        required: false
        default: ""
      publish-only:
        description: "Publish versions already on main (no bump, tag or commit). Use after a failed publish."
        type: boolean
        default: false
      use-token:
        description: "Emergency fallback: publish with the NPM_TOKEN secret instead of trusted publishing."
        type: boolean
        default: false
      dry-run:
        description: "Plan only: do not commit, tag, push or publish."
        type: boolean
        default: true

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships an older npm.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t build

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Publishes through npm trusted publishing (OIDC), configured per package on npmjs.com for
      # workflow release.yml. The placeholder token below is what setup-node uses when no secret is
      # set; a real or empty NODE_AUTH_TOKEN would stop npm from using OIDC.
      - name: Release
        run: |
          if [ "$PUBLISH_ONLY" = "true" ]; then
            pnpm nx release publish ${PROJECTS:+--projects=$PROJECTS} $DRY_RUN
          else
            pnpm nx release $SPECIFIER ${PROJECTS:+--projects=$PROJECTS} $DRY_RUN --yes
          fi
        env:
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # nx release commits "chore(release): publish ..."; skip local commit hooks in CI.
          HUSKY: 0
          NODE_AUTH_TOKEN: ${{ inputs.use-token && secrets.NPM_TOKEN || 'XXXXX-XXXXX-XXXXX-XXXXX' }}
          NPM_CONFIG_PROVENANCE: true
          PROJECTS: ${{ inputs.projects }}
          PUBLISH_ONLY: ${{ inputs.publish-only }}
          SPECIFIER: ${{ inputs.specifier }}

name: "Release"

# The automatic trigger (workflow_run after CI) is off until the first 1.x release is cut by hand.
# Restore it afterwards:
#   workflow_run:
#     workflows: ["CI"]
#     branches: [main]
#     types: [completed]
on:
  workflow_dispatch:
    inputs:
      specifier:
        description: "Version specifier (patch|minor|major|x.y.z). Empty = conventional commits."
        required: false
        default: ""
      projects:
        description: "Comma-separated project names to release. Empty = all."
        required: false
        default: ""
      dry-run:
        description: "Plan only: do not commit, tag, push or publish."
        type: boolean
        default: true

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run-many -t build

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Prefer npm trusted publishing (OIDC) per package settings on npmjs.com.
      # Optionally set NPM_TOKEN as a fallback secret for older packages.
      - name: Release
        run: pnpm nx release $SPECIFIER ${PROJECTS:+--projects=$PROJECTS} $DRY_RUN --yes
        env:
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # nx release commits "chore(release): publish ..."; skip local commit hooks in CI.
          HUSKY: 0
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          PROJECTS: ${{ inputs.projects }}
          SPECIFIER: ${{ inputs.specifier }}
